<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace | Vimal Farms</title>
<link rel="stylesheet" href="css/shop.css">
<style>body { align-items: flex-start; }</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="plans-wrap">
    <div class="page-title">
        <h1>🛍️ Marketplace</h1>
        <p>Browse products from all Vimal Farms partner pet shops</p>
    </div>

    <div class="market-grid" id="marketGrid">Loading products...</div>
</div>

<script src="js/supabaseClient.js"></script>
<script>
(async () => {
    const grid = document.getElementById("marketGrid");

    // fetch products joined with the shop profile, only from active shops
    const { data: products, error } = await supabase
        .from("products")
        .select("*, profiles(shop_name, subscription_status, plan_expiry)")
        .order("created_at", { ascending: false });

    if (error) {
        grid.innerHTML = `<p style="color:#ff9b9b;">Could not load products: ${error.message}</p>`;
        return;
    }

    const today = new Date().toISOString().split("T")[0];
    const activeProducts = (products || []).filter(p =>
        p.profiles &&
        p.profiles.subscription_status === "active" &&
        p.profiles.plan_expiry >= today
    );

    if (activeProducts.length === 0) {
        grid.innerHTML = `<p style="color:#9aa8b8; grid-column:1/-1; text-align:center;">No products available yet. Check back soon!</p>`;
        return;
    }

    grid.innerHTML = activeProducts.map(p => `
        <div class="market-card">
            <img src="${p.image_url || 'images/placeholder.png'}" alt="${escapeHtml(p.product_name)}">
            <div class="info">
                <h4>${escapeHtml(p.product_name)}</h4>
                <div class="shop-tag">Sold by: ${escapeHtml(p.profiles.shop_name)}</div>
                <div class="price">₹${Number(p.price).toFixed(2)}</div>
            </div>
        </div>
    `).join("");
})();

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
}
</script>

</body>
</html>
