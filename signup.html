<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Vimal Farms</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/navbar-auth.css">
    <link rel="stylesheet" href="css/shop.css">
    <style>body { align-items: flex-start; padding-top: 60px; }</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
 
<div class="form-card">
    <h2>📝 Create Account</h2>
    <p class="subtitle">Join Vimal Farms to shop pets, food & accessories</p>
 
    <div id="message"></div>
 
    <form id="signupForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Your full name" required>
        </div>
 
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>
 
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="10-digit phone number" required>
        </div>
 
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>
 
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm_password" placeholder="Re-enter password" required>
        </div>
 
        <button type="submit" class="btn-primary" id="submitBtn">Create Account</button>
    </form>
 
    <div class="switch-link">
        Already have an account? <a href="login.html">Login here</a>
    </div>
</div>
 
<!-- Supabase client must load BEFORE auth.js -->
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/navbar-inject.js"></script>
 
<script>
const form = document.getElementById("signupForm");
const messageBox = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");
 
form.addEventListener("submit", function (e) {
    e.preventDefault();
    messageBox.innerHTML = "";
 
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirm_password = document.getElementById("confirm_password").value;
 
    if (password !== confirm_password) {
        messageBox.innerHTML = `<div class="error-msg">Passwords do not match.</div>`;
        return;
    }
    if (password.length < 6) {
        messageBox.innerHTML = `<div class="error-msg">Password must be at least 6 characters.</div>`;
        return;
    }
 
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";
 
    signUpUser(name, email, phone, password)
        .then(function () {
            messageBox.innerHTML = `<div class="success-msg">✅ Account created! Check your email to confirm (if required), then <a href="login.html" style="color:#FFD700;">login here</a>.</div>`;
            form.reset();
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";
        })
        .catch(function (error) {
            messageBox.innerHTML = `<div class="error-msg">${error.message || error}</div>`;
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";
        });
});
</script>
 
</body>
</html>
