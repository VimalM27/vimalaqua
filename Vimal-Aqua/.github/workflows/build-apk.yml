name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
  workflow_dispatch: {}

jobs:
  # Builds an installable debug APK for testing/sharing.
  build-debug:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vimal-pets-world-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  # Release build - leave disabled until Play Store signing is configured.
  build-release:
    if: ${{ vars.ENABLE_RELEASE_BUILD == 'true' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build unsigned release APK
        run: gradle assembleRelease

      - name: Sign release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: vimal-pets-world-release-apk
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}