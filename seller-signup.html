<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Owner Signup | Vimal Pets World</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/navbar-auth.css">
<link rel="stylesheet" href="css/shop.css">
<style>
    body { align-items: flex-start; padding-top: 40px; flex-wrap: wrap; }
    body > .home-btn-wrap,
    body > .form-card {
        flex: 1 1 100%;
        width: 100%;
    }
    .form-card {
        max-width: 460px !important;
        width: 90% !important;
        margin: 20px auto 60px !important;
        align-self: center !important;
        position: relative !important;
        top: 0 !important;
    }
    .home-btn-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 4px;
    }
    .home-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #0c447c;
        color: #fff;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: bold;
    }
    .home-btn:hover { opacity: 0.9; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="home-btn-wrap">
    <a href="index.html" class="home-btn">🏠 Back to Home</a>
</div>

<div class="form-card">
    <h2>🐾 Become a Seller</h2>
    <p class="subtitle">Register your pet shop and start selling on Vimal Pets World</p>

    <div id="message"></div>

    <form id="signupForm">
        <div class="form-group">
            <label>Shop Name</label>
            <input type="text" id="shop_name" placeholder="e.g. Coimbatore Pet Corner" required>
        </div>

        <div class="form-group">
            <label>Owner Name</label>
            <input type="text" id="owner_name" placeholder="Your full name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="10-digit phone number" required>
        </div>

        <div class="form-group">
            <label>Shop Address</label>
            <input type="text" id="shop_address" placeholder="City, State">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm_password" placeholder="Re-enter password" required>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Create Seller Account</button>
    </form>

    <div class="switch-link">
        Already have an account? <a href="login.html">Login here</a>
    </div>
</div>

<script src="js/supabaseClient.js"></script>
<script>
const form = document.getElementById("signupForm");
const messageBox = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageBox.innerHTML = "";

    const shop_name = document.getElementById("shop_name").value.trim();
    const owner_name = document.getElementById("owner_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const shop_address = document.getElementById("shop_address").value.trim();
    const password = document.getElementById("password").value;
    const confirm_password = document.getElementById("confirm_password").value;

    if (password !== confirm_password) {
        messageBox.innerHTML = `<div class="error-msg">Passwords do not match.</div>`;
        return;
    }
    if (password.length < 6) {
        messageBox.innerHTML = `<div class="error-msg">Password must be at least 6 characters.</div>`;
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    // Create the auth user AND pass shop details as user metadata.
    // A database trigger (on_auth_user_created) reads this metadata and
    // creates the matching row in `profiles` automatically — server-side,
    // so it works even before the user confirms their email and has no
    // active session yet (which is why the old client-side insert failed).
    const { data: authData, error: authError } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                shop_name: shop_name,
                owner_name: owner_name,
                phone: phone,
                shop_address: shop_address
            }
        }
    });

    if (authError) {
        messageBox.innerHTML = `<div class="error-msg">${authError.message}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Seller Account";
        return;
    }

    // No client-side insert into `profiles` anymore — the trigger handles it.
    messageBox.innerHTML = `<div class="success-msg">✅ Account created! Check your email to confirm (if required), then <a href="login.html" style="color:#FFD700;">login here</a>.</div>`;
    form.reset();

    submitBtn.disabled = false;
    submitBtn.textContent = "Create Seller Account";
});
</script>

</body>
</html>
