<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Owner Login | Vimal Farms</title>
<link rel="stylesheet" href="css/shop.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="form-card">
    <h2>🐾 Seller Login</h2>
    <p class="subtitle">Access your Vimal Farms seller dashboard</p>

    <div id="message"></div>

    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Your password" required>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Login</button>
    </form>

    <div class="switch-link">
        New seller? <a href="signup.html">Create an account</a>
    </div>
</div>

<script src="js/supabaseClient.js"></script>
<script>
const form = document.getElementById("loginForm");
const messageBox = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

// if already logged in, skip straight to dashboard
(async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = "dashboard.html";
})();

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageBox.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
        messageBox.innerHTML = `<div class="error-msg">${error.message}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Login";
    } else {
        window.location.href = "dashboard.html";
    }
});
</script>

</body>
</html>
