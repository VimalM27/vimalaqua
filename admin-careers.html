<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Careers | Admin</title>
<link rel="icon" type="image/png" href="/icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07162e;--card:#0f2547;--line:rgba(255,255,255,.12);--txt:#e8f1fb;--mute:#9fb2c8;--acc:#22c1c3;--gold:#FFD700}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:var(--bg);color:var(--txt);min-height:100vh}
header{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--line);background:#081b3c}
header h1{font-size:18px;color:var(--gold)}header a{color:var(--acc);text-decoration:none;font-size:14px;margin-left:14px}
.wrap{max-width:1200px;margin:0 auto;padding:22px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;font-size:14px}
.tab.on{background:var(--acc);color:#06232f;font-weight:700;border-color:var(--acc)}
.sec{display:none}.sec.on{display:block}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar input,.bar select{width:auto;flex:1 1 180px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:#0a1c3a;color:#fff;font-size:14px}
textarea{resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.item{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.item b{font-size:15px}.item small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid;margin-right:6px}
.ok{color:#22c1c3;border-color:#22c1c3;background:rgba(34,193,195,.12)}.warn{color:#ffd36b;border-color:#ffd36b;background:rgba(255,211,107,.1)}
.bad{color:#ff9b9b;border-color:#ff9b9b;background:rgba(255,80,80,.12)}.mute{color:#cfd8e3;border-color:rgba(255,255,255,.3)}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;display:inline-block}
.btn:hover{background:rgba(34,193,195,.14)}.btn.s{background:var(--acc);color:#06232f}.btn.r{border-color:#ff9b9b;color:#ff9b9b}
.row{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
dialog{margin:auto;border:1px solid var(--line);border-radius:16px;background:#0d2347;color:var(--txt);width:min(680px,94vw);max-height:92vh;overflow:auto;padding:22px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{color:var(--gold);margin-bottom:12px}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;color:#cfd8e3;margin-bottom:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:14px;margin-bottom:14px}dt{color:var(--mute)}dd{overflow-wrap:anywhere}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
@media(max-width:640px){.g2{grid-template-columns:1fr}dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>💼 Careers: roles &amp; applications</h1><div><a href="admin-dashboard.html">← Dashboard</a><a href="careers.html" target="_blank" rel="noopener">View public page ↗</a></div></header>
<div class="wrap">
  <div class="tabs"><button class="tab on" data-t="apps">Applications <span id="nApps"></span></button><button class="tab" data-t="jobs">Job roles</button></div>

  <section class="sec on" id="t-apps">
    <div class="bar">
      <input id="aq" type="search" placeholder="Search name, phone, email…">
      <select id="aj"><option value="">All roles</option></select>
      <select id="as"><option value="">All statuses</option></select>
    </div>
    <div id="appList"><div class="empty">Loading…</div></div>
  </section>

  <section class="sec" id="t-jobs">
    <div class="bar"><button class="btn s" id="newJob">+ Post a new role</button></div>
    <div id="jobList"><div class="empty">Loading…</div></div>
  </section>
</div>

<dialog id="jobDlg"><h3 id="jobTitleH">Job role</h3>
  <form id="jobForm" novalidate>
    <div class="f"><label>Job title *</label><input id="j_title" maxlength="120"></div>
    <div class="g2"><div class="f"><label>Department</label><input id="j_dept" maxlength="60" placeholder="Retail, Aquarium, Delivery…"></div>
      <div class="f"><label>Location *</label><input id="j_loc" maxlength="80" value="Coimbatore"></div></div>
    <div class="g2"><div class="f"><label>Job type</label><select id="j_type"><option>Full-time</option><option>Part-time</option><option>Internship</option><option>Contract</option></select></div>
      <div class="f"><label>Experience</label><input id="j_exp" maxlength="40" placeholder="0-2 years"></div></div>
    <div class="g2"><div class="f"><label>Salary (optional, shown publicly)</label><input id="j_sal" maxlength="60" placeholder="₹15,000 - ₹22,000 / month"></div>
      <div class="f"><label>Last date to apply</label><input id="j_close" type="date"></div></div>
    <div class="f"><label>Description *</label><textarea id="j_desc" rows="4" maxlength="3000"></textarea></div>
    <div class="f"><label>Requirements (one per line)</label><textarea id="j_req" rows="4" maxlength="3000"></textarea></div>
    <div class="f"><label>Status</label><select id="j_status"><option value="open">Open (visible to everyone)</option><option value="draft">Draft (hidden)</option><option value="closed">Closed</option></select></div>
    <div class="row"><button class="btn s" type="submit">Save role</button><button class="btn" type="button" id="jobCancel">Cancel</button></div>
  </form></dialog>

<dialog id="appDlg"><div id="appBody"></div></dialog>

<script src="js/supabaseClient.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ST = { applied: "Applied", under_review: "Under review", shortlisted: "Shortlisted", interview_scheduled: "Interview scheduled", interviewed: "Interviewed", offered: "Offered", hired: "Hired", rejected: "Rejected" };
const stCls = s => ["shortlisted", "interview_scheduled", "offered", "hired"].includes(s) ? "ok" : s === "rejected" ? "bad" : "warn";
let jobs = [], apps = [], editJob = null, cur = null;

async function guard() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { location.replace("login.html"); return false; }
  const { data } = await supabaseClient.from("user_roles").select("role").eq("user_id", user.id).eq("role", "admin").maybeSingle();
  if (!data) { document.body.innerHTML = '<p style="padding:40px;color:#ff9b9b">Admins only.</p>'; return false; }
  return true;
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".sec").forEach(s => s.classList.toggle("on", s.id === "t-" + b.dataset.t));
});
$("as").innerHTML += Object.entries(ST).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");

async function load() {
  const [j, a] = await Promise.all([
    supabaseClient.from("career_jobs").select("*").order("created_at", { ascending: false }),
    supabaseClient.from("career_applications").select("*").order("created_at", { ascending: false })]);
  jobs = j.data || []; apps = a.data || [];
  if (j.error || a.error) alert("Could not load: " + (j.error || a.error).message);
  $("aj").innerHTML = `<option value="">All roles</option><option value="general">General applications</option>` + jobs.map(x => `<option value="${esc(x.id)}">${esc(x.title)}</option>`).join("");
  renderJobs(); renderApps();
}

/* ---- jobs ---- */
function renderJobs() {
  $("jobList").innerHTML = jobs.length ? jobs.map(j => {
    const n = apps.filter(a => a.job_id === j.id).length, open = j.status === "open";
    return `<div class="card item"><div><b>${esc(j.title)}</b> <span class="badge ${open ? "ok" : j.status === "draft" ? "warn" : "mute"}">${esc(j.status)}</span>
      <small>${esc(j.job_type)} · ${esc(j.location)}${j.department ? " · " + esc(j.department) : ""} · ${n} application${n === 1 ? "" : "s"}${j.closes_on ? " · closes " + esc(j.closes_on) : ""}</small></div>
      <div class="row"><button class="btn" data-ed="${esc(j.id)}">Edit</button>
      <button class="btn" data-tg="${esc(j.id)}">${open ? "Close role" : "Re-open"}</button>
      <button class="btn r" data-dj="${esc(j.id)}">Delete</button></div></div>`;
  }).join("") : `<div class="empty">No roles yet. Click “Post a new role”.</div>`;
}
$("newJob").onclick = () => openJob(null);
$("jobCancel").onclick = () => $("jobDlg").close();
function openJob(id) {
  editJob = id; const j = jobs.find(x => x.id === id) || {};
  $("jobTitleH").textContent = id ? "Edit role" : "Post a new role";
  $("j_title").value = j.title || ""; $("j_dept").value = j.department || ""; $("j_loc").value = j.location || "Coimbatore";
  $("j_type").value = j.job_type || "Full-time"; $("j_exp").value = j.experience || ""; $("j_sal").value = j.salary_range || "";
  $("j_close").value = j.closes_on || ""; $("j_desc").value = j.description || ""; $("j_req").value = j.requirements || ""; $("j_status").value = j.status || "open";
  $("jobDlg").showModal();
}
$("jobForm").addEventListener("submit", async e => {
  e.preventDefault();
  const row = { title: $("j_title").value.trim(), department: $("j_dept").value.trim() || null, location: $("j_loc").value.trim() || "Coimbatore",
    job_type: $("j_type").value, experience: $("j_exp").value.trim() || null, salary_range: $("j_sal").value.trim() || null,
    closes_on: $("j_close").value || null, description: $("j_desc").value.trim(), requirements: $("j_req").value.trim() || null, status: $("j_status").value };
  if (row.title.length < 3 || !row.description) return alert("Job title and description are required.");
  const q = editJob ? supabaseClient.from("career_jobs").update(row).eq("id", editJob) : supabaseClient.from("career_jobs").insert([row]);
  const { error } = await q; if (error) return alert(error.message);
  $("jobDlg").close(); load();
});
$("jobList").addEventListener("click", async e => {
  const ed = e.target.closest("[data-ed]"), tg = e.target.closest("[data-tg]"), dj = e.target.closest("[data-dj]");
  if (ed) openJob(ed.dataset.ed);
  if (tg) { const j = jobs.find(x => x.id === tg.dataset.tg); const { error } = await supabaseClient.from("career_jobs").update({ status: j.status === "open" ? "closed" : "open" }).eq("id", j.id); if (error) alert(error.message); load(); }
  if (dj) { if (!confirm("Delete this role? Existing applications are kept (shown as the old role title).")) return; const { error } = await supabaseClient.from("career_jobs").delete().eq("id", dj.dataset.dj); if (error) alert(error.message); load(); }
});

/* ---- applications ---- */
function renderApps() {
  const q = $("aq").value.toLowerCase(), jf = $("aj").value, sf = $("as").value;
  const rows = apps.filter(a => (`${a.applicant_name} ${a.phone} ${a.email}`).toLowerCase().includes(q) &&
    (!jf || (jf === "general" ? !a.job_id && a.job_title === "General application" : a.job_id === jf)) && (!sf || a.status === sf));
  $("nApps").textContent = apps.filter(a => a.status === "applied").length ? `(${apps.filter(a => a.status === "applied").length} new)` : "";
  $("appList").innerHTML = rows.length ? rows.map(a => `<div class="card item" data-app="${esc(a.id)}" style="cursor:pointer">
    <div><b>${esc(a.applicant_name)}</b> <span class="badge ${stCls(a.status)}">${esc(ST[a.status])}</span>
    <small>${esc(a.job_title || "")} · ${esc(a.phone)} · ${esc(new Date(a.created_at).toLocaleDateString("en-IN"))}${a.experience_years != null ? " · " + esc(a.experience_years) + " yrs" : ""}</small>
    ${a.interview_at ? `<small>📅 Interview: ${esc(new Date(a.interview_at).toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }))}</small>` : ""}</div>
    <button class="btn">Open</button></div>`).join("") : `<div class="empty">No applications found.</div>`;
}
["aq", "aj", "as"].forEach(id => $(id).addEventListener("input", renderApps));
$("appList").addEventListener("click", e => { const c = e.target.closest("[data-app]"); if (c) openApp(c.dataset.app); });

function toLocalInput(iso) { if (!iso) return ""; const d = new Date(iso); const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function openApp(id) {
  cur = apps.find(a => a.id === id); if (!cur) return; const a = cur;
  $("appBody").innerHTML = `<h3>${esc(a.applicant_name)}</h3>
  <dl><dt>Role</dt><dd>${esc(a.job_title || "")}</dd><dt>Phone</dt><dd>${esc(a.phone)}</dd><dt>Email</dt><dd>${esc(a.email)}</dd>
  <dt>City</dt><dd>${esc(a.city || "—")}</dd><dt>Experience</dt><dd>${a.experience_years != null ? esc(a.experience_years) + " years" : "—"}</dd>
  <dt>Applied</dt><dd>${esc(new Date(a.created_at).toLocaleString("en-IN"))}</dd><dt>Tracking code</dt><dd>${esc(a.tracking_code)}</dd>
  <dt>Cover note</dt><dd>${esc(a.cover_note || "—")}</dd></dl>
  <div class="row"><button class="btn s" id="viewCv">📄 View resume</button><a class="btn" id="waBtn" target="_blank" rel="noopener">💬 WhatsApp applicant</a></div><hr>
  <div class="f"><label>Status</label><select id="x_status">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${k === a.status ? "selected" : ""}>${v}</option>`).join("")}</select></div>
  <div id="ivBox" class="g2" style="display:none">
    <div class="f"><label>Interview date &amp; time (IST) *</label><input id="x_at" type="datetime-local" value="${esc(toLocalInput(a.interview_at))}"></div>
    <div class="f"><label>Mode</label><select id="x_mode"><option value="in_person">In person</option><option value="phone">Phone call</option><option value="video">Video call</option></select></div>
    <div class="f" style="grid-column:1/-1"><label>Address or meeting link (https://…)</label><input id="x_place" maxlength="300" value="${esc(a.interview_place || "")}"></div></div>
  <div class="f"><label>Message the applicant will see (optional)</label><textarea id="x_pub" rows="2" maxlength="500">${esc(a.public_note || "")}</textarea></div>
  <div class="f"><label>Internal notes (private)</label><textarea id="x_adm" rows="3" maxlength="1500">${esc(a.admin_note || "")}</textarea></div>
  <div class="row"><button class="btn s" id="saveApp">Save</button><button class="btn" id="closeApp">Close</button><button class="btn r" id="delApp">Delete application</button></div>`;
  $("x_mode").value = a.interview_mode || "in_person";
  const sync = () => { $("ivBox").style.display = ["interview_scheduled", "interviewed"].includes($("x_status").value) ? "grid" : "none"; };
  $("x_status").onchange = sync; sync();
  $("waBtn").href = "https://wa.me/91" + a.phone + "?text=" + encodeURIComponent(waText());
  $("x_status").addEventListener("change", () => { $("waBtn").href = "https://wa.me/91" + a.phone + "?text=" + encodeURIComponent(waText()); });
  $("x_at").addEventListener("input", () => { $("waBtn").href = "https://wa.me/91" + a.phone + "?text=" + encodeURIComponent(waText()); });
  $("viewCv").onclick = async () => {
    const { data, error } = await supabaseClient.storage.from("career-resumes").createSignedUrl(a.resume_path, 120);
    if (error) return alert("Could not open resume: " + error.message); window.open(data.signedUrl, "_blank", "noopener");
  };
  $("closeApp").onclick = () => $("appDlg").close();
  $("saveApp").onclick = saveApp; $("delApp").onclick = delApp;
  $("appDlg").showModal();
}
function waText() {
  const a = cur, st = $("x_status").value, at = $("x_at") && $("x_at").value;
  if (st === "interview_scheduled" && at) return `Hi ${a.applicant_name.split(" ")[0]}, thank you for applying for ${a.job_title} at Vimal Pets & Toys. Your interview is on ${new Date(at).toLocaleString("en-IN", { weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" })}${$("x_place").value ? " at/via " + $("x_place").value : ""}. Please confirm. You can also check details on our Careers page with code ${a.tracking_code}.`;
  return `Hi ${a.applicant_name.split(" ")[0]}, this is Vimal Pets & Toys regarding your application for ${a.job_title}.`;
}
async function saveApp() {
  const st = $("x_status").value, iv = ["interview_scheduled", "interviewed"].includes(st);
  const at = $("x_at").value, place = $("x_place").value.trim();
  if (st === "interview_scheduled" && !at) return alert("Choose the interview date and time.");
  if (iv && place && /^https?:/i.test(place) && !/^https:/i.test(place)) return alert("Meeting links must start with https://");
  const patch = { status: st, public_note: $("x_pub").value.trim() || null, admin_note: $("x_adm").value.trim() || null,
    interview_at: iv && at ? new Date(at).toISOString() : (iv ? cur.interview_at : null),
    interview_mode: iv ? $("x_mode").value : null, interview_place: iv ? (place || null) : null };
  const { error } = await supabaseClient.from("career_applications").update(patch).eq("id", cur.id);
  if (error) return alert(error.message);
  $("appDlg").close(); load();
}
async function delApp() {
  if (!confirm("Permanently delete this application and the resume file?")) return;
  await supabaseClient.storage.from("career-resumes").remove([cur.resume_path]);
  const { error } = await supabaseClient.from("career_applications").delete().eq("id", cur.id);
  if (error) return alert(error.message); $("appDlg").close(); load();
}
(async () => { if (await guard()) load(); })();
</script>
</body>
</html>
