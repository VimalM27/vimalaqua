<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard | Vimal Farms</title>
<link rel="stylesheet" href="css/shop.css">
<style>body { align-items: flex-start; }</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="dashboard-wrap">

    <div class="dash-header">
        <div>
            <h2 id="shopNameHeading">🏪 Loading...</h2>
            <span class="status-badge" id="statusBadge">Checking...</span>
        </div>
        <div style="display:flex; gap:10px;">
            <a href="subscription.html" class="link-btn outline" id="subscribeBtn">Subscribe to Sell</a>
            <a href="#" class="logout-btn" id="logoutBtn">Logout</a>
        </div>
    </div>

    <div id="topMessage"></div>

    <div class="dash-grid">

        <div class="panel">
            <h3>➕ Post a New Product</h3>
            <div id="productFormArea">Loading...</div>
        </div>

        <div class="panel">
            <h3>📦 Your Products (<span id="productCount">0</span>)</h3>
            <div class="product-list" id="productList">Loading...</div>
        </div>

    </div>

</div>

<script src="js/supabaseClient.js"></script>
<script>
let currentUser = null;
let isActive = false;

async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
        window.location.href = "login.html";
        return;
    }
    currentUser = session.user;

    // load profile
    const { data: profile, error } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();

    if (error || !profile) {
        document.getElementById("topMessage").innerHTML = `<div class="error-msg">Could not load your shop profile.</div>`;
        return;
    }

    document.getElementById("shopNameHeading").textContent = "🏪 " + profile.shop_name;

    const today = new Date().toISOString().split("T")[0];
    isActive = profile.subscription_status === "active" && profile.plan_expiry >= today;

    const badge = document.getElementById("statusBadge");
    const subBtn = document.getElementById("subscribeBtn");

    if (isActive) {
        badge.className = "status-badge status-active";
        badge.textContent = `Subscription Active (${profile.plan_name}) — expires ${profile.plan_expiry}`;
        subBtn.textContent = "Change Plan";
        subBtn.className = "link-btn outline";
    } else {
        badge.className = "status-badge status-inactive";
        badge.textContent = "No Active Subscription";
        subBtn.textContent = "Subscribe to Sell";
        subBtn.className = "link-btn solid";
    }

    renderProductForm();
    loadProducts();

    // check for payment success flag
    const params = new URLSearchParams(window.location.search);
    if (params.get("payment") === "success") {
        document.getElementById("topMessage").innerHTML = `<div class="success-msg">✅ Payment successful! Your subscription is now active.</div>`;
    }
}

function renderProductForm() {
    const area = document.getElementById("productFormArea");

    if (!isActive) {
        area.innerHTML = `<div class="error-msg">You need an active subscription before you can post products. <a href="subscription.html" style="color:#FFD700;">Subscribe now →</a></div>`;
        return;
    }

    area.innerHTML = `
        <form id="productForm">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="product_name" placeholder="e.g. Aquarium Filter Pump" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="category" required>
                    <option value="">Select category</option>
                    <option value="Fish">Fish</option>
                    <option value="Birds">Birds</option>
                    <option value="Dogs">Dogs</option>
                    <option value="Cats">Cats</option>
                    <option value="Small Pets">Small Pets</option>
                    <option value="Pet Food">Pet Food</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Aquariums">Aquariums</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" step="0.01" id="price" placeholder="e.g. 499.00" required>
            </div>
            <div class="form-group">
                <label>Stock Quantity</label>
                <input type="number" id="stock" placeholder="e.g. 10" required>
            </div>
            <div class="form-group">
                <label>Product Image</label>
                <input type="file" id="product_image" accept="image/*">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="description" rows="3" placeholder="Short product description"></textarea>
            </div>
            <button type="submit" class="btn-primary" id="postBtn">Post Product</button>
        </form>
    `;

    document.getElementById("productForm").addEventListener("submit", handleAddProduct);
}

async function handleAddProduct(e) {
    e.preventDefault();
    const postBtn = document.getElementById("postBtn");
    postBtn.disabled = true;
    postBtn.textContent = "Posting...";

    const product_name = document.getElementById("product_name").value.trim();
    const category = document.getElementById("category").value;
    const price = parseFloat(document.getElementById("price").value);
    const stock = parseInt(document.getElementById("stock").value);
    const description = document.getElementById("description").value.trim();
    const imageFile = document.getElementById("product_image").files[0];

    let image_url = "";

    if (imageFile) {
        const fileName = `${currentUser.id}_${Date.now()}_${imageFile.name}`;
        const { data: uploadData, error: uploadError } = await supabase
            .storage
            .from("product-images")
            .upload(fileName, imageFile);

        if (uploadError) {
            document.getElementById("topMessage").innerHTML = `<div class="error-msg">Image upload failed: ${uploadError.message}</div>`;
        } else {
            const { data: urlData } = supabase.storage.from("product-images").getPublicUrl(fileName);
            image_url = urlData.publicUrl;
        }
    }

    const { error } = await supabase.from("products").insert([{
        shop_owner_id: currentUser.id,
        product_name, category, price, stock, image_url, description
    }]);

    if (error) {
        document.getElementById("topMessage").innerHTML = `<div class="error-msg">${error.message}</div>`;
    } else {
        document.getElementById("topMessage").innerHTML = `<div class="success-msg">✅ Product posted successfully!</div>`;
        document.getElementById("productForm").reset();
        loadProducts();
    }

    postBtn.disabled = false;
    postBtn.textContent = "Post Product";
}

async function loadProducts() {
    const { data: products, error } = await supabase
        .from("products")
        .select("*")
        .eq("shop_owner_id", currentUser.id)
        .order("created_at", { ascending: false });

    const list = document.getElementById("productList");
    document.getElementById("productCount").textContent = products ? products.length : 0;

    if (error) {
        list.innerHTML = `<div class="error-msg">Could not load products.</div>`;
        return;
    }

    if (!products || products.length === 0) {
        list.innerHTML = `<p style="color:#9aa8b8;">You haven't posted any products yet.</p>`;
        return;
    }

    list.innerHTML = products.map(p => `
        <div class="product-item">
            <div>
                <div class="p-name">${escapeHtml(p.product_name)}</div>
                <div class="p-price">₹${Number(p.price).toFixed(2)} · Stock: ${p.stock} · ${escapeHtml(p.category || "")}</div>
            </div>
            <button class="delete-link" onclick="deleteProduct('${p.id}')">Delete</button>
        </div>
    `).join("");
}

async function deleteProduct(id) {
    if (!confirm("Delete this product?")) return;
    const { error } = await supabase.from("products").delete().eq("id", id);
    if (!error) loadProducts();
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

document.getElementById("logoutBtn").addEventListener("click", async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = "login.html";
});

init();
</script>

</body>
</html>
