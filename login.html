<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vimal Farms</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/navbar-auth.css">
    <link rel="stylesheet" href="css/shop.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
 
<div class="form-card">
    <h2>👤 Login</h2>
    <p class="subtitle">Sign in to your Vimal Farms account</p>
 
    <div id="message"></div>
 
    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>
 
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Your password" required>
        </div>
 
        <button type="submit" class="btn-primary" id="submitBtn">Login</button>
    </form>
 
    <div class="switch-link">
        New here? <a href="signup.html">Create an account</a>
    </div>
</div>
 
<!-- Supabase client must load BEFORE auth.js -->
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/navbar-inject.js"></script>
 
<script>
const form = document.getElementById("loginForm");
const messageBox = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");
 
form.addEventListener("submit", function (e) {
    e.preventDefault();
    messageBox.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";
 
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
 
    loginUser(email, password)
        .then(function () {
            window.location.href = "index.html";
        })
        .catch(function (error) {
            messageBox.innerHTML = `<div class="error-msg">${error.message || error}</div>`;
            submitBtn.disabled = false;
            submitBtn.textContent = "Login";
        });
});
</script>
 
</body>
</html>
