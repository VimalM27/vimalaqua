<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vimal Farms</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar-auth.css">
    <style>
        body { align-items: flex-start; padding-top: 40px; flex-wrap: wrap; }
        body > .home-btn-wrap,
        body > .form-card {
            flex: 1 1 100%;
            width: 100%;
        }
        .form-card {
            max-width: 420px !important;
            width: 90% !important;
            margin: 20px auto 60px !important;
            align-self: center !important;
            position: relative !important;
            top: 0 !important;
        }
        .home-btn-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 4px;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0c447c;
            color: #fff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
        }
        .home-btn:hover { opacity: 0.9; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="home-btn-wrap">
    <a href="index.html" class="home-btn">🏠 Back to Home</a>
</div>

<div class="form-card">
    <h2>👤 Login</h2>
    <p class="subtitle">Sign in to your Vimal Farms account</p>

    <div id="message"></div>

    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Your password" required>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Login</button>
    </form>

    <div class="switch-link">
        New here? <a href="signup.html">Create an account</a>
    </div>
</div>

<script>
const form = document.getElementById("loginForm");
const messageBox = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

// if already logged in, skip straight to home
(async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = "index.html";
})();

form.addEventListener("submit", async function (e) {
    e.preventDefault();
    messageBox.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
        messageBox.innerHTML = `<div class="error-msg">${error.message}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Login";
    } else {
        window.location.href = "index.html";
    }
});
</script>

<script src="js/supabaseClient.js"></script>

</body>
</html>
